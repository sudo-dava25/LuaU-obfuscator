<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>LuaU VM Obfuscator</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: linear-gradient(145deg, #f6f9fc 0%, #eef2f8 100%);
    color: #1a2c3e;
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', 'Fira Code', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }
  ::-webkit-scrollbar-track {
    background: #dce5ec;
    border-radius: 10px;
  }
  ::-webkit-scrollbar-thumb {
    background: #6c8fb3;
    border-radius: 10px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #4a6f96;
  }

  header {
    padding: 20px 28px;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(16px);
    border-bottom: 2px solid #cbdde9;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .logo-area {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 1.55rem;
    font-weight: 700;
    background: linear-gradient(115deg, #1f6392, #3b82b6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: -0.3px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .badge {
    background: #e6f0fa;
    border: 1px solid #b9d0e4;
    border-radius: 60px;
    padding: 5px 14px;
    font-size: 0.75rem;
    font-weight: 600;
    color: #1c5a8b;
  }
  .vm-chip {
    font-family: monospace;
    font-size: 0.7rem;
    background: #ecf3f9;
    padding: 4px 12px;
    border-radius: 40px;
    color: #2a628f;
    font-weight: 500;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 22px;
    padding: 28px 24px;
    max-width: 1600px;
    margin: 0 auto;
    width: 100%;
  }

  .pane {
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(2px);
    border-radius: 32px;
    border: 1px solid rgba(72, 120, 160, 0.25);
    overflow: hidden;
    transition: all 0.25s ease;
    box-shadow: 0 12px 28px -8px rgba(0, 32, 64, 0.08);
  }
  .pane:hover {
    border-color: #7da3c2;
    box-shadow: 0 20px 32px -12px rgba(28, 78, 118, 0.12);
  }
  .pane-header {
    padding: 16px 22px;
    background: #ffffffcc;
    border-bottom: 1px solid #cfdfeb;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .pane-header span:first-child {
    font-weight: 700;
    font-size: 0.9rem;
    letter-spacing: 0.3px;
    background: #eef4fc;
    padding: 6px 16px;
    border-radius: 80px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: #1e4a76;
  }
  .pane-icon {
    display: inline-flex;
    align-items: center;
  }

  textarea {
    width: 100%;
    background: #fefefe;
    color: #1a2e42;
    border: none;
    outline: none;
    padding: 20px;
    font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    font-size: 0.85rem;
    line-height: 1.6;
    resize: vertical;
    min-height: 220px;
    transition: background 0.2s;
  }
  textarea:focus {
    background: #ffffff;
    box-shadow: inset 0 0 0 2px #a0c4e2;
  }
  textarea::placeholder {
    color: #9bb1c4;
    font-style: italic;
  }

  .toolbar {
    padding: 14px 20px;
    background: #f8fafd;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    align-items: center;
    border-top: 1px solid #e2edf5;
  }
  button {
    padding: 8px 20px;
    border-radius: 48px;
    border: none;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #eef2f7;
    color: #1e4b6e;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  button i {
    width: 18px;
    height: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .btn-primary {
    background: linear-gradient(105deg, #1f6e8c, #2a86b0);
    color: white;
    box-shadow: 0 4px 12px rgba(36, 113, 163, 0.25);
  }
  .btn-primary:hover {
    background: linear-gradient(105deg, #2980a3, #3596c2);
    transform: translateY(-1px);
    box-shadow: 0 8px 18px rgba(34, 109, 158, 0.3);
  }
  .btn-primary:disabled {
    background: #b9cfdf;
    transform: none;
    box-shadow: none;
    color: #eef3f7;
    cursor: not-allowed;
  }
  .btn-secondary {
    background: #e4edf5;
    border: 1px solid #c7d9e8;
    color: #235e86;
  }
  .btn-secondary:hover {
    background: #d6e3ef;
    border-color: #9eb9d0;
    transform: translateY(-1px);
  }
  .btn-download {
    background: #e1eefb;
    border: 1px solid #aac6e0;
    color: #1f5e87;
  }
  .btn-download:hover {
    background: #cfe2f3;
    color: #0e4468;
  }
  .status {
    font-size: 0.8rem;
    background: #eef3fc;
    padding: 5px 16px;
    border-radius: 60px;
    font-family: monospace;
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-weight: 500;
    color: #2c628b;
  }
  .status.error {
    color: #bc4e2c;
    background: #ffe6e0;
    border-left: 3px solid #e25822;
  }
  .status.success {
    color: #1e7640;
    background: #e0f5e8;
  }
  .meta {
    font-size: 0.75rem;
    color: #4c7399;
    background: #eef4fa;
    padding: 5px 14px;
    border-radius: 60px;
    margin-left: auto;
    font-family: monospace;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-weight: 500;
  }
  #copyBtn {
    transition: 0.15s;
  }

  @media (min-width: 780px) {
    main {
      flex-direction: row;
      gap: 26px;
      padding: 32px 32px;
    }
    .pane {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    textarea {
      min-height: 500px;
      resize: vertical;
    }
  }

  @media (max-width: 560px) {
    header {
      padding: 14px 18px;
    }
    .pane-header span:first-child {
      font-size: 0.75rem;
    }
    button {
      padding: 6px 14px;
      font-size: 0.75rem;
    }
    .toolbar {
      justify-content: space-between;
    }
    .status, .meta {
      font-size: 0.7rem;
    }
  }

  .footer-meta {
    text-align: center;
    font-size: 0.7rem;
    padding: 14px;
    color: #5c7f9c;
    border-top: 1px solid #d0e0ec;
    margin-top: 6px;
    background: #fefeffaa;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
</style>
</head>
<body>
<header>
  <div class="logo-area">
    <h1><i data-lucide="zap" class="lucide-icon"></i> VM·OBFUSCATOR</h1>
    <div class="badge">LuaU Core</div>
    <div class="vm-chip">VM-based · Server-side</div>
  </div>
  <span style="font-size: 0.75rem; opacity: 0.8;"><i data-lucide="lock" class="lucide-icon"></i> opaque bytecode</span>
</header>
<main>
  <div class="pane">
    <div class="pane-header">
      <span><i data-lucide="file-text" class="lucide-icon pane-icon"></i> INPUT — Luau Source</span>
      <span style="font-size:0.7rem; background: none;">raw script</span>
    </div>
    <textarea id="inputCode" placeholder="-- [[ Paste your Luau / Roblox script here ]] --&#10;local Players = game:GetService(&quot;Players&quot;)&#10;function onPlayerAdded(player)&#10;    print(&quot;Hello &quot; .. player.Name)&#10;end&#10;Players.PlayerAdded:Connect(onPlayerAdded)"></textarea>
    <div class="toolbar">
      <button class="btn-primary" id="obfBtn"><i data-lucide="shield"></i> Obfuscate</button>
      <button class="btn-secondary" id="clearBtn"><i data-lucide="trash-2"></i> Clear</button>
      <span class="status" id="statusText"><i data-lucide="circle"></i> ready</span>
    </div>
  </div>

  <div class="pane">
    <div class="pane-header">
      <span><i data-lucide="lock-keyhole" class="lucide-icon pane-icon"></i> OUTPUT — VM Obfuscated</span>
      <span style="font-size:0.7rem;">execution ready</span>
    </div>
    <textarea id="outputCode" placeholder="[ obfuscated code will appear here ]" readonly></textarea>
    <div class="toolbar">
      <button class="btn-secondary" id="copyBtn"><i data-lucide="clipboard"></i> Copy</button>
      <button class="btn-download" id="downloadBtn"><i data-lucide="download"></i> Download .lua</button>
      <span class="meta" id="metaText"></span>
    </div>
  </div>
</main>
<div class="footer-meta">
  <i data-lucide="cpu"></i> VM obfuscation | preserves logic | server-side processing
</div>
<script>
  // initialize lucide icons after DOM ready
  document.addEventListener('DOMContentLoaded', function() {
    if (typeof lucide !== 'undefined') {
      lucide.createIcons();
    }
  });

  (function(){
    const obfBtn   = document.getElementById('obfBtn');
    const clearBtn = document.getElementById('clearBtn');
    const copyBtn  = document.getElementById('copyBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const inputEl  = document.getElementById('inputCode');
    const outputEl = document.getElementById('outputCode');
    const statusEl = document.getElementById('statusText');
    const metaEl   = document.getElementById('metaText');

    function refreshIcons() {
      if (typeof lucide !== 'undefined') {
        lucide.createIcons();
      }
    }

    function setStatus(msg, type) {
      statusEl.innerHTML = '';
      let iconHtml = '';
      if (type === 'error') iconHtml = '<i data-lucide="alert-circle"></i> ';
      else if (type === 'success') iconHtml = '<i data-lucide="check-circle"></i> ';
      else if (type === '') iconHtml = '<i data-lucide="loader-circle"></i> ';
      else iconHtml = '<i data-lucide="info"></i> ';
      statusEl.innerHTML = iconHtml + msg;
      statusEl.className = 'status ' + (type || '');
      if (!type) statusEl.classList.add('status');
      refreshIcons();
    }

    function setMeta(meta) {
      if (!meta) { metaEl.innerHTML = ''; return; }
      metaEl.innerHTML = `<i data-lucide="bar-chart-2"></i> ${(meta.inputSize/1024).toFixed(1)}KB → ${(meta.outputSize/1024).toFixed(1)}KB · <i data-lucide="timer"></i> ${meta.processingMs}ms`;
      refreshIcons();
    }

    downloadBtn.addEventListener('click', function() {
      const obfuscatedCode = outputEl.value;
      if (!obfuscatedCode || obfuscatedCode.trim() === "") {
        setStatus("No obfuscated output to download", "error");
        return;
      }
      const blob = new Blob([obfuscatedCode], {type: "text/plain"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const timestamp = new Date().toISOString().slice(0,19).replace(/:/g, '-');
      a.download = `obfuscated_${timestamp}.lua`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      setStatus("Downloaded as .lua file", "success");
      setTimeout(() => {
        if (statusEl.innerHTML.includes("Downloaded")) setStatus("Done", "success");
      }, 1500);
    });

    obfBtn.addEventListener('click', async function() {
      const code = inputEl.value.trim();
      if (!code) { setStatus('Please enter LuaU code first.', 'error'); return; }
      obfBtn.disabled = true;
      obfBtn.innerHTML = '<i data-lucide="loader-circle"></i> Obfuscating...';
      refreshIcons();
      setStatus('sending to VM engine...', '');
      outputEl.value = '';
      if (copyBtn) copyBtn.style.display = 'inline-flex';
      setMeta(null);
      downloadBtn.disabled = false;

      try {
        const res = await fetch('/api/obfuscate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code }),
        });
        const data = await res.json();
        if (!res.ok || !data.success) {
          const lineInfo = data.line ? ` (line ${data.line})` : '';
          setStatus('Error: ' + data.error + lineInfo, 'error');
          outputEl.value = '';
          setMeta(null);
        } else {
          outputEl.value = data.result;
          setStatus('Obfuscation complete', 'success');
          setMeta(data.meta);
          copyBtn.style.display = 'inline-flex';
        }
      } catch(e) {
        setStatus('Network error: ' + e.message, 'error');
        outputEl.value = '';
      } finally {
        obfBtn.disabled = false;
        obfBtn.innerHTML = '<i data-lucide="shield"></i> Obfuscate';
        refreshIcons();
      }
    });

    clearBtn.addEventListener('click', function() {
      inputEl.value = '';
      outputEl.value = '';
      setStatus('cleared', '');
      setMeta(null);
      copyBtn.style.display = 'inline-flex';
      statusEl.innerHTML = '<i data-lucide="circle"></i> ready';
      statusEl.className = 'status';
      refreshIcons();
    });

    copyBtn.addEventListener('click', async function() {
      const outputText = outputEl.value;
      if (!outputText) {
        setStatus('nothing to copy', 'error');
        return;
      }
      try {
        await navigator.clipboard.writeText(outputText);
        const orig = copyBtn.innerHTML;
        copyBtn.innerHTML = '<i data-lucide="check"></i> Copied!';
        refreshIcons();
        setTimeout(() => { 
          copyBtn.innerHTML = orig;
          refreshIcons();
        }, 1500);
        setStatus('copied to clipboard', 'success');
      } catch(e) {
        outputEl.select();
        document.execCommand('copy');
        setStatus('copied (fallback)', 'success');
      }
    });

    inputEl.addEventListener('keydown', function(e) {
      if (e.key === 'Tab') {
        e.preventDefault();
        const s = this.selectionStart, end = this.selectionEnd;
        this.value = this.value.substring(0, s) + '  ' + this.value.substring(end);
        this.selectionStart = this.selectionEnd = s + 2;
      }
    });

    function checkDownloadAvail() {
      if (outputEl.value.trim() === "") {
        downloadBtn.style.opacity = '0.6';
      } else {
        downloadBtn.style.opacity = '1';
      }
    }
    const outputObserver = new MutationObserver(() => checkDownloadAvail());
    outputObserver.observe(outputEl, { attributes: true, childList: true, subtree: true, characterData: true });
    checkDownloadAvail();
    setInterval(checkDownloadAvail, 500);
    refreshIcons();
  })();
</script>
</body>
</html>
