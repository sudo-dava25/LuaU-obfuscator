<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LuaU Obfuscator</title>
<link href="https://cdn.jsdelivr.net/npm/lucide@0.264.0/dist/lucide.min.css" rel="stylesheet">
<style>
  /* Reset */
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',sans-serif;background:#f9f9f9;color:#111;min-height:100vh;display:flex;flex-direction:column;}

  /* Header */
  header{padding:20px;display:flex;align-items:center;justify-between:space-between;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.05);}
  header h1{font-size:1.5rem;font-weight:700;color:#4f46e5;display:flex;align-items:center;gap:8px;}
  header span{font-size:0.85rem;color:#6b7280;}

  /* Main layout */
  main{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:20px;}
  @media(max-width:768px){ main{grid-template-columns:1fr;} }

  .pane{display:flex;flex-direction:column;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,0.05);}

  .pane-header{padding:15px 20px;background:#f3f4f6;font-weight:600;color:#374151;font-size:0.95rem;display:flex;align-items:center;gap:6px;}

  textarea{flex:1;width:100%;padding:16px;border:none;outline:none;font-family:'Courier New',monospace;font-size:0.9rem;line-height:1.6;resize:none;background:#fff;color:#111;}

  .toolbar{padding:12px 20px;display:flex;gap:10px;align-items:center;background:#f3f4f6;flex-wrap:wrap;}
  button{display:flex;align-items:center;gap:6px;padding:10px 18px;border:none;border-radius:8px;font-weight:600;font-size:0.875rem;cursor:pointer;transition:all 0.15s;}
  .btn-primary{background:#4f46e5;color:#fff;}
  .btn-primary:hover{background:#4338ca;}
  .btn-primary:disabled{background:#c7d2fe;cursor:not-allowed;}
  .btn-secondary{background:#e5e7eb;color:#374151;}
  .btn-secondary:hover{background:#d1d5db;}

  .status{font-size:0.85rem;color:#6b7280;margin-left:auto;display:flex;align-items:center;gap:4px;}
  .status.error{color:#ef4444;}
  .status.success{color:#10b981;}

  .meta{font-size:0.75rem;color:#6b7280;}
</style>
</head>
<body>
<header>
  <h1><i data-lucide="zap"></i> LuaU Obfuscator</h1>
  <span>VM-based</span>
</header>
<main>
  <div class="pane">
    <div class="pane-header"><i data-lucide="edit"></i> Input</div>
    <textarea id="inputCode" placeholder="Paste your LuaU / Roblox code here..."></textarea>
    <div class="toolbar">
      <button class="btn-primary" id="obfBtn"><i data-lucide="shield-off"></i> Obfuscate</button>
      <button class="btn-secondary" id="clearBtn"><i data-lucide="trash-2"></i> Clear</button>
      <span class="status" id="statusText"></span>
    </div>
  </div>

  <div class="pane">
    <div class="pane-header"><i data-lucide="lock"></i> Output</div>
    <textarea id="outputCode" placeholder="Obfuscated output will appear here..." readonly></textarea>
    <div class="toolbar">
      <button class="btn-secondary" id="copyBtn"><i data-lucide="copy"></i> Copy</button>
      <button class="btn-secondary" id="downloadBtn"><i data-lucide="download"></i> Download</button>
      <span class="meta" id="metaText"></span>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/lucide@0.264.0/dist/lucide.min.js"></script>
<script>
lucide.replace(); // render icons

(function(){
  const obfBtn   = document.getElementById('obfBtn');
  const clearBtn = document.getElementById('clearBtn');
  const copyBtn  = document.getElementById('copyBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const inputEl  = document.getElementById('inputCode');
  const outputEl = document.getElementById('outputCode');
  const statusEl = document.getElementById('statusText');
  const metaEl   = document.getElementById('metaText');

  function setStatus(msg,type){statusEl.textContent=msg;statusEl.className='status '+(type||'');}
  function setMeta(meta){metaEl.textContent=meta?`${(meta.inputSize/1024).toFixed(1)}KB → ${(meta.outputSize/1024).toFixed(1)}KB · ${meta.processingMs}ms`:"";}

  obfBtn.addEventListener('click', async function(){
    const code=inputEl.value.trim();
    if(!code){setStatus('Please enter LuaU code first.','error');return;}
    obfBtn.disabled=true; obfBtn.innerHTML='<i data-lucide="loader"></i> Obfuscating...'; setStatus('Processing...',''); outputEl.value=''; copyBtn.style.display='none'; downloadBtn.style.display='none'; setMeta(null); lucide.replace();
    try{
      const res=await fetch('/api/obfuscate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});
      const data=await res.json();
      if(!res.ok||!data.success){ setStatus('Error: '+data.error+(data.line?` (line ${data.line})`:''),'error'); }
      else{
        outputEl.value=data.result;
        setStatus('Done','success');
        setMeta(data.meta);
        copyBtn.style.display='';
        downloadBtn.style.display='';
      }
    }catch(e){ setStatus('Network error: '+e.message,'error'); }
    finally{ obfBtn.disabled=false; obfBtn.innerHTML='<i data-lucide="shield-off"></i> Obfuscate'; lucide.replace(); }
  });

  clearBtn.addEventListener('click',()=>{ inputEl.value=''; outputEl.value=''; setStatus('',''); setMeta(null); copyBtn.style.display='none'; downloadBtn.style.display='none'; });

  copyBtn.addEventListener('click',async function(){try{await navigator.clipboard.writeText(outputEl.value);const orig=copyBtn.innerHTML;copyBtn.innerHTML='<i data-lucide="check"></i> Copied!';setTimeout(()=>{copyBtn.innerHTML=orig;lucide.replace();},1500);}catch(e){outputEl.select();document.execCommand('copy');}});

  downloadBtn.addEventListener('click',function(){
    const blob=new Blob([outputEl.value],{type:'text/plain'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='obfuscated.lua';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  inputEl.addEventListener('keydown',function(e){if(e.key==='Tab'){e.preventDefault();const s=this.selectionStart,end=this.selectionEnd;this.value=this.value.substring(0,s)+'  '+this.value.substring(end);this.selectionStart=this.selectionEnd=s+2;}});
})();
</script>
</body>
</html>
