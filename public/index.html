<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>LuaU VM Obfuscator</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: linear-gradient(135deg, #f5f7fa 0%, #e9eef3 100%);
    color: #1a2c3e;
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: #d0dfec;
    border-radius: 10px;
  }
  ::-webkit-scrollbar-thumb {
    background: #9bb1c4;
    border-radius: 10px;
  }

  header {
    padding: 16px 24px;
    background: #ffffff;
    border-bottom: 1px solid #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 {
    font-size: 1.3rem;
    font-weight: 600;
    color: #1e4a76;
    letter-spacing: -0.3px;
  }
  .version {
    font-size: 0.7rem;
    color: #7c8b9c;
    background: #f0f2f5;
    padding: 3px 10px;
    border-radius: 20px;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 24px;
    max-width: 1400px;
    margin: 0 auto;
    width: 100%;
  }

  .pane {
    background: #ffffff;
    border-radius: 20px;
    border: 1px solid #e2e8f0;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
  }

  .pane-header {
    padding: 12px 18px;
    background: #fafbfc;
    border-bottom: 1px solid #eef2f6;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .pane-header span:first-child {
    font-weight: 600;
    font-size: 0.8rem;
    letter-spacing: 0.3px;
    color: #4a5b6e;
  }

  textarea {
    width: 100%;
    background: #fefefe;
    color: #1a2e42;
    border: none;
    outline: none;
    padding: 16px;
    font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    font-size: 0.8rem;
    line-height: 1.55;
    resize: vertical;
    min-height: 200px;
  }
  textarea:focus {
    background: #ffffff;
    box-shadow: inset 0 0 0 1px #cbdde9;
  }
  textarea::placeholder {
    color: #b9c4d0;
  }
  textarea[readonly] {
    background: #fafbfc;
  }

  .toolbar {
    padding: 10px 16px;
    background: #fafbfc;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    border-top: 1px solid #eef2f6;
  }
  button {
    padding: 6px 14px;
    border-radius: 40px;
    border: none;
    font-weight: 500;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #eef2f6;
    color: #2c5282;
  }
  .btn-primary {
    background: #2c7eb0;
    color: white;
  }
  .btn-primary:hover {
    background: #1f6e8c;
    transform: translateY(-1px);
  }
  .btn-primary:disabled {
    background: #b8cfdf;
    cursor: not-allowed;
    transform: none;
  }
  .btn-secondary {
    background: #eef2f6;
    border: 1px solid #dce5ec;
  }
  .btn-secondary:hover {
    background: #e4eaf0;
  }
  .btn-download {
    background: #eef2f6;
    border: 1px solid #dce5ec;
  }
  .btn-download:hover {
    background: #e4eaf0;
  }
  .status {
    font-size: 0.7rem;
    background: #f0f2f5;
    padding: 4px 12px;
    border-radius: 40px;
    margin-left: auto;
    font-family: monospace;
    color: #5a6e82;
  }
  .status.error {
    color: #c25a3a;
    background: #feece6;
  }
  .status.success {
    color: #2c7a4a;
    background: #e6f4ea;
  }
  .meta {
    font-size: 0.7rem;
    color: #6b7f94;
    background: #f0f2f5;
    padding: 4px 12px;
    border-radius: 40px;
    margin-left: auto;
    font-family: monospace;
  }

  @media (min-width: 768px) {
    main {
      flex-direction: row;
      gap: 20px;
      padding: 28px;
    }
    .pane {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    textarea {
      min-height: 460px;
    }
  }

  @media (max-width: 560px) {
    header {
      padding: 12px 16px;
    }
    header h1 {
      font-size: 1.1rem;
    }
    button {
      padding: 5px 12px;
      font-size: 0.7rem;
    }
    .toolbar {
      gap: 8px;
    }
  }

  footer {
    text-align: center;
    font-size: 0.7rem;
    padding: 12px;
    color: #8a9bb0;
    border-top: 1px solid #e2e8f0;
    background: #ffffff;
  }
</style>
</head>
<body>
<header>
  <h1>LuaU VM Obfuscator</h1>
  <span class="version">VM</span>
</header>
<main>
  <div class="pane">
    <div class="pane-header">
      <span>INPUT — LuaU Source</span>
    </div>
    <textarea id="inputCode" placeholder="-- Paste your LuaU / Roblox code here..."></textarea>
    <div class="toolbar">
      <button class="btn-primary" id="obfBtn">Obfuscate</button>
      <button class="btn-secondary" id="clearBtn">Clear</button>
      <span class="status" id="statusText">ready</span>
    </div>
  </div>

  <div class="pane">
    <div class="pane-header">
      <span>OUTPUT — Obfuscated</span>
    </div>
    <textarea id="outputCode" placeholder="Obfuscated output will appear here..." readonly></textarea>
    <div class="toolbar">
      <button class="btn-secondary" id="copyBtn">Copy</button>
      <button class="btn-download" id="downloadBtn">Download</button>
      <span class="meta" id="metaText"></span>
    </div>
  </div>
</main>
<footer>
  © LuaU-obfuscator
</footer>
<script>
  (function(){
    const obfBtn   = document.getElementById('obfBtn');
    const clearBtn = document.getElementById('clearBtn');
    const copyBtn  = document.getElementById('copyBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const inputEl  = document.getElementById('inputCode');
    const outputEl = document.getElementById('outputCode');
    const statusEl = document.getElementById('statusText');
    const metaEl   = document.getElementById('metaText');

    function setStatus(msg, type) {
      statusEl.textContent = msg;
      statusEl.className = 'status ' + (type || '');
    }

    function setMeta(meta) {
      if (!meta) { metaEl.textContent = ''; return; }
      metaEl.textContent = `${(meta.inputSize/1024).toFixed(1)}KB → ${(meta.outputSize/1024).toFixed(1)}KB · ${meta.processingMs}ms`;
    }

    downloadBtn.addEventListener('click', function() {
      const obfuscatedCode = outputEl.value;
      if (!obfuscatedCode || obfuscatedCode.trim() === "") {
        setStatus('No output to download', 'error');
        return;
      }
      const blob = new Blob([obfuscatedCode], {type: "text/plain"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const timestamp = new Date().toISOString().slice(0,19).replace(/:/g, '-');
      a.download = `obfuscated_${timestamp}.lua`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      setStatus('Downloaded', 'success');
      setTimeout(() => {
        if (statusEl.textContent === 'Downloaded') setStatus('ready', '');
      }, 1500);
    });

    obfBtn.addEventListener('click', async function() {
      const code = inputEl.value.trim();
      if (!code) { setStatus('Please enter LuaU code first.', 'error'); return; }
      obfBtn.disabled = true;
      obfBtn.textContent = 'Obfuscating...';
      setStatus('Processing...', '');
      outputEl.value = '';
      setMeta(null);

      try {
        const res = await fetch('/api/obfuscate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code }),
        });
        const data = await res.json();
        if (!res.ok || !data.success) {
          const lineInfo = data.line ? ` (line ${data.line})` : '';
          setStatus('Error: ' + data.error + lineInfo, 'error');
          outputEl.value = '';
          setMeta(null);
        } else {
          outputEl.value = data.result;
          setStatus('Done', 'success');
          setMeta(data.meta);
        }
      } catch(e) {
        setStatus('Network error: ' + e.message, 'error');
        outputEl.value = '';
      } finally {
        obfBtn.disabled = false;
        obfBtn.textContent = 'Obfuscate';
      }
    });

    clearBtn.addEventListener('click', function() {
      inputEl.value = '';
      outputEl.value = '';
      setStatus('ready', '');
      setMeta(null);
    });

    copyBtn.addEventListener('click', async function() {
      const outputText = outputEl.value;
      if (!outputText) {
        setStatus('Nothing to copy', 'error');
        return;
      }
      try {
        await navigator.clipboard.writeText(outputText);
        const orig = copyBtn.textContent;
        copyBtn.textContent = 'Copied!';
        setTimeout(() => { copyBtn.textContent = orig; }, 1500);
        setStatus('Copied to clipboard', 'success');
      } catch(e) {
        outputEl.select();
        document.execCommand('copy');
        setStatus('Copied (fallback)', 'success');
      }
    });

    inputEl.addEventListener('keydown', function(e) {
      if (e.key === 'Tab') {
        e.preventDefault();
        const s = this.selectionStart, end = this.selectionEnd;
        this.value = this.value.substring(0, s) + '  ' + this.value.substring(end);
        this.selectionStart = this.selectionEnd = s + 2;
      }
    });
  })();
</script>
</body>
</html>
