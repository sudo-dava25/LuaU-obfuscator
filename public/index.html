<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuaU Obfuscator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.363.0/umd/lucide.min.js">
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

        :root {
            --white: #ffffff;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-700: #334155;
            --gray-900: #0f172a;
            --indigo-50: #eef2ff;
            --indigo-100: #e0e7ff;
            --indigo-500: #6366f1;
            --indigo-600: #4f46e5;
            --indigo-700: #4338ca;
            --emerald-50: #ecfdf5;
            --emerald-500: #10b981;
            --emerald-600: #059669;
            --amber-50: #fffbeb;
            --amber-400: #fbbf24;
            --amber-500: #f59e0b;
            --rose-50: #fff1f2;
            --rose-500: #f43f5e;
            --sky-50: #f0f9ff;
            --sky-400: #38bdf8;
            --sky-500: #0ea5e9;
            --sans: 'Plus Jakarta Sans', system-ui, sans-serif;
            --mono: 'JetBrains Mono', 'Courier New', monospace;
            --radius-sm: 8px;
            --radius: 12px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
            --shadow: 0 4px 16px rgba(15, 23, 42, 0.08), 0 1px 4px rgba(15, 23, 42, 0.04);
            --shadow-lg: 0 12px 40px rgba(15, 23, 42, 0.12), 0 4px 12px rgba(15, 23, 42, 0.06);
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            background: var(--gray-50);
            color: var(--gray-900);
            font-family: var(--sans);
            font-size: 14px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--gray-50);
            background-image:
                radial-gradient(ellipse 80% 50% at 20% -10%, rgba(99, 102, 241, 0.07) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 80% 110%, rgba(14, 165, 233, 0.06) 0%, transparent 60%);
        }

        .nav {
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            height: 56px;
            padding: 0 28px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--gray-200);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .nav-logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--indigo-600), var(--sky-500));
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
            flex-shrink: 0;
        }

        .nav-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--gray-900);
            letter-spacing: -0.02em;
        }

        .nav-tags {
            display: flex;
            gap: 6px;
            margin-left: 14px;
        }

        .tag {
            font-size: 11px;
            font-weight: 600;
            font-family: var(--mono);
            padding: 2px 8px;
            border-radius: 6px;
            letter-spacing: 0.02em;
        }
        .tag-indigo {
            background: var(--indigo-50);
            color: var(--indigo-600);
            border: 1px solid var(--indigo-100);
        }
        .tag-sky {
            background: var(--sky-50);
            color: var(--sky-500);
            border: 1px solid rgba(14, 165, 233, 0.2);
        }

        .nav-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 500;
            font-family: var(--mono);
            padding: 5px 12px;
            background: var(--white);
            border: 1.5px solid var(--gray-200);
            border-radius: 20px;
            color: var(--gray-400);
            transition: all 0.25s;
            min-width: 100px;
            justify-content: center;
        }
        .status-pill.success {
            color: var(--emerald-600);
            border-color: rgba(16, 185, 129, 0.3);
            background: var(--emerald-50);
        }
        .status-pill.error {
            color: var(--rose-500);
            border-color: rgba(244, 63, 94, 0.3);
            background: var(--rose-50);
        }
        .status-pill.busy {
            color: var(--indigo-600);
            border-color: rgba(99, 102, 241, 0.3);
            background: var(--indigo-50);
        }

        .pulse {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
            background: var(--gray-300);
            transition: background 0.25s;
        }
        .status-pill.success .pulse {
            background: var(--emerald-500);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
            animation: pulseAnim 2s infinite;
        }
        .status-pill.error .pulse {
            background: var(--rose-500);
            box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.2);
        }
        .status-pill.busy .pulse {
            background: var(--indigo-500);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            animation: pulseAnim 1s infinite;
        }

        @keyframes pulseAnim {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.4;
            }
        }

        .content {
            flex: 1;
            padding: 28px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        .editor-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 0;
            align-items: stretch;
            flex: 1;
            min-height: 0;
        }

        .card {
            background: var(--white);
            border: 1.5px solid var(--gray-200);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .card:focus-within {
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: var(--shadow), 0 0 0 4px rgba(99, 102, 241, 0.06);
        }

        .card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            border-bottom: 1px solid var(--gray-100);
            background: var(--gray-50);
            flex-shrink: 0;
        }

        .card-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--gray-500);
        }
        .label-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .dot-indigo {
            background: linear-gradient(135deg, var(--indigo-500), var(--sky-400));
        }
        .dot-emerald {
            background: linear-gradient(135deg, var(--emerald-500), var(--sky-400));
        }
        .card-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .editor-body {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        .editor-ta {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            padding: 18px 20px;
            font-family: var(--mono);
            font-size: 13px;
            font-weight: 400;
            line-height: 1.8;
            color: var(--gray-700);
            tab-size: 2;
            caret-color: var(--indigo-500);
        }
        .editor-ta::placeholder {
            color: var(--gray-300);
            font-style: italic;
        }
        #outputCode {
            color: var(--gray-500);
        }

        .card-foot {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 18px;
            border-top: 1px solid var(--gray-100);
            background: var(--gray-50);
            flex-shrink: 0;
        }
        .foot-meta {
            font-size: 11.5px;
            font-family: var(--mono);
            color: var(--gray-400);
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .foot-chip {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .center-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 16px;
            gap: 12px;
        }

        .run-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, var(--indigo-600), var(--indigo-500));
            color: #fff;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            font-family: var(--sans);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.35), 0 1px 4px rgba(99, 102, 241, 0.2);
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            flex-shrink: 0;
        }
        .run-btn:hover:not(:disabled) {
            transform: scale(1.06) translateY(-1px);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.45);
        }
        .run-btn:active:not(:disabled) {
            transform: scale(0.96);
        }
        .run-btn:disabled {
            background: var(--gray-200);
            color: var(--gray-400);
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .arrow-line {
            width: 1.5px;
            height: 40px;
            background: linear-gradient(to bottom, transparent, var(--gray-200), transparent);
            border-radius: 2px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 0 16px;
            height: 32px;
            border: 1.5px solid transparent;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-family: var(--sans);
            font-size: 12.5px;
            font-weight: 600;
            letter-spacing: -0.01em;
            transition: all 0.15s;
            user-select: none;
            white-space: nowrap;
        }
        .btn-solid {
            background: var(--indigo-600);
            color: #fff;
            border-color: var(--indigo-600);
        }
        .btn-solid:hover:not(:disabled) {
            background: var(--indigo-700);
            border-color: var(--indigo-700);
        }
        .btn-outline {
            background: var(--white);
            color: var(--gray-600);
            border-color: var(--gray-200);
        }
        .btn-outline:hover:not(:disabled) {
            background: var(--gray-50);
            border-color: var(--gray-300);
            color: var(--gray-900);
        }
        .btn-outline:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-sm {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 0 10px;
            height: 28px;
            border: 1.5px solid var(--gray-200);
            border-radius: var(--radius-sm);
            background: var(--white);
            color: var(--gray-400);
            cursor: pointer;
            font-family: var(--sans);
            font-size: 11.5px;
            font-weight: 600;
            transition: all 0.15s;
            user-select: none;
        }
        .btn-sm:hover:not(:disabled) {
            border-color: var(--gray-300);
            color: var(--gray-700);
            background: var(--gray-50);
        }
        .btn-sm:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        .btn-sm.success {
            border-color: rgba(16, 185, 129, 0.4);
            color: var(--emerald-600);
            background: var(--emerald-50);
        }
        .btn-icon-sm {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            padding: 0;
            border: 1.5px solid var(--gray-200);
            border-radius: var(--radius-sm);
            background: var(--white);
            color: var(--gray-400);
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-icon-sm:hover:not(:disabled) {
            border-color: var(--gray-300);
            color: var(--gray-700);
        }
        .btn-icon-sm:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .spinning {
            animation: spin 0.65s linear infinite;
            display: inline-flex;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 200;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: var(--white);
            border: 1.5px solid var(--gray-200);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            font-size: 13px;
            font-weight: 500;
            color: var(--gray-700);
            transform: translateY(16px) scale(0.96);
            opacity: 0;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }
        .toast.show {
            transform: translateY(0) scale(1);
            opacity: 1;
        }
        .toast.toast-ok {
            border-color: rgba(16, 185, 129, 0.3);
        }
        .toast.toast-ok .ti {
            color: var(--emerald-500);
        }

        kbd {
            font-family: var(--mono);
            font-size: 10px;
            font-weight: 500;
            background: var(--gray-100);
            color: var(--gray-500);
            border: 1px solid var(--gray-200);
            border-radius: 4px;
            padding: 1px 6px;
        }

        @media (max-width: 768px) {
            .editor-row {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr auto 1fr;
            }
            .center-col {
                flex-direction: row;
                padding: 12px 0;
            }
            .arrow-line {
                width: 40px;
                height: 1.5px;
                background: linear-gradient(to right, transparent, var(--gray-200), transparent);
            }
            .content {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <nav class="nav">
            <a class="nav-brand" href="#">
                <div class="nav-logo">
                    <i data-lucide="shield-check" style="width:16px;height:16px;color:#fff;"></i>
                </div>
                <span class="nav-title">LuaU Obfuscator</span>
            </a>
            <div class="nav-tags">
                <span class="tag tag-indigo">VM-based</span>
                <span class="tag tag-sky">Server-side</span>
            </div>
            <div class="nav-right">
                <div class="status-pill" id="statusPill">
                    <span class="pulse"></span>
                    <span id="statusTxt">Ready</span>
                </div>
            </div>
        </nav>

        <div class="content">
            <div class="editor-row" style="height: calc(100vh - 56px - 56px);">
                <div class="card">
                    <div class="card-head">
                        <div class="card-label">
                            <span class="label-dot dot-indigo"></span>
                            Source Code
                        </div>
                        <div class="card-actions">
                            <kbd>Ctrl ↵</kbd>
                            <button class="btn-icon-sm" id="clearBtn" title="Clear">
                                <i data-lucide="trash-2" style="width:13px;height:13px;"></i>
                            </button>
                        </div>
                    </div>
                    <div class="editor-body">
                        <textarea id="inputCode" class="editor-ta" spellcheck="false" autocorrect="off" autocapitalize="off"
                        placeholder="-- Paste your LuaU / Roblox script here...

            type Greeting = {name: string}

            local function greet(name: string): string
            return 'Hello, ' .. name .. '!'
            end

            local x: number = 10 // 3
            x += 5
            print(greet('World'), x)"></textarea>
                    </div>
                    <div class="card-foot">
                        <button class="btn btn-solid" id="obfBtnFoot">
                            <i data-lucide="zap" style="width:13px;height:13px;"></i>
                            Obfuscate
                        </button>
                        <button class="btn btn-outline" id="clearBtnFoot">
                            Clear
                        </button>
                        <span class="foot-meta">
                            <span id="inputMeta"></span>
                        </span>
                    </div>
                </div>

                <div class="center-col">
                    <div class="arrow-line"></div>
                    <button class="run-btn" id="obfBtn" title="Obfuscate (Ctrl+Enter)">
                        <i data-lucide="lock" style="width:20px;height:20px;"></i>
                    </button>
                    <div class="arrow-line"></div>
                </div>

                <div class="card">
                    <div class="card-head">
                        <div class="card-label">
                            <span class="label-dot dot-emerald"></span>
                            Obfuscated Output
                        </div>
                        <div class="card-actions">
                            <button class="btn-sm" id="copyBtn" disabled>
                                <i data-lucide="copy" style="width:12px;height:12px;"></i>
                                Copy
                            </button>
                            <button class="btn-icon-sm" id="downloadBtn" disabled title="Download .lua">
                                <i data-lucide="download" style="width:13px;height:13px;"></i>
                            </button>
                        </div>
                    </div>
                    <div class="editor-body">
                        <textarea id="outputCode" class="editor-ta" spellcheck="false" readonly placeholder="Obfuscated output will appear here..."></textarea>
                    </div>
                    <div class="card-foot">
                        <div class="foot-meta" id="metaRow" style="margin-left:0;display:none;">
                            <span class="foot-chip">
                                <i data-lucide="file-input" style="width:11px;height:11px;color:var(--gray-300);"></i>
                                <span id="metaIn">—</span>
                            </span>
                            <span style="color:var(--gray-300);">→</span>
                            <span class="foot-chip">
                                <i data-lucide="file-output" style="width:11px;height:11px;color:var(--gray-300);"></i>
                                <span id="metaOut">—</span>
                            </span>
                            <span class="foot-chip">
                                <i data-lucide="timer" style="width:11px;height:11px;color:var(--gray-300);"></i>
                                <span id="metaMs">—</span>
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">
        <span class="ti"><i data-lucide="check-circle-2" style="width:15px;height:15px;display:block;"></i></span>
        <span id="toastTxt">Done</span>
    </div>

    <script>
        (function() {
            lucide.createIcons();

            const inputEl = document.getElementById('inputCode');
            const outputEl = document.getElementById('outputCode');
            const obfBtn = document.getElementById('obfBtn');
            const obfBtnFoot = document.getElementById('obfBtnFoot');
            const clearBtn = document.getElementById('clearBtn');
            const clearBtnFoot = document.getElementById('clearBtnFoot');
            const copyBtn = document.getElementById('copyBtn');
            const dlBtn = document.getElementById('downloadBtn');
            const statusPill = document.getElementById('statusPill');
            const statusTxt = document.getElementById('statusTxt');
            const inputMeta = document.getElementById('inputMeta');
            const metaRow = document.getElementById('metaRow');
            const metaIn = document.getElementById('metaIn');
            const metaOut = document.getElementById('metaOut');
            const metaMs = document.getElementById('metaMs');
            const toast = document.getElementById('toast');
            const toastTxt = document.getElementById('toastTxt');

            function setStatus(text, type) {
                statusTxt.textContent = text;
                statusPill.className = 'status-pill' + (type ? ' ' + type : '');
            }

            function fmt(b) { return b >= 1024 ? (b / 1024).toFixed(1) + ' KB' : b + ' B'; }

            function setMeta(meta) {
                if (!meta) { metaRow.style.display = 'none'; return; }
                metaRow.style.display = 'flex';
                metaIn.textContent = fmt(meta.inputSize);
                metaOut.textContent = fmt(meta.outputSize);
                metaMs.textContent = meta.processingMs + 'ms';
            }

            let toastTimer;

            function showToast(msg, type) {
                toastTxt.textContent = msg;
                toast.className = 'toast show' + (type ? ' toast-' + type : '');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toast.className = 'toast', 2600);
            }

            inputEl.addEventListener('input', function() {
                const n = this.value.length;
                inputMeta.textContent = n ? n.toLocaleString() + ' chars' : '';
            });

            async function doObfuscate() {
                const code = inputEl.value.trim();
                if (!code) { setStatus('No input', 'error');
                    setTimeout(() => setStatus('Ready', ''), 2000); return; }

                [obfBtn, obfBtnFoot].forEach(b => b.disabled = true);
                obfBtn.innerHTML =
                    '<span class="spinning"><i data-lucide="loader-2" style="width:20px;height:20px;display:block;"></i></span>';
                obfBtnFoot.innerHTML =
                    '<span class="spinning"><i data-lucide="loader-2" style="width:13px;height:13px;display:block;"></i></span> Processing';
                lucide.createIcons();

                setStatus('Processing…', 'busy');
                outputEl.value = '';
                copyBtn.disabled = true;
                dlBtn.disabled = true;
                setMeta(null);

                try {
                    const res = await fetch('/api/obfuscate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ code }),
                    });
                    const data = await res.json();
                    if (!res.ok || !data.success) {
                        const hint = data.line ? ' · line ' + data.line : '';
                        setStatus('Error' + hint, 'error');
                    } else {
                        outputEl.value = data.result;
                        setStatus('Done', 'success');
                        setMeta(data.meta);
                        copyBtn.disabled = false;
                        dlBtn.disabled = false;
                        showToast('Obfuscation complete', 'ok');
                    }
                } catch (e) {
                    setStatus('Network error', 'error');
                } finally {
                    [obfBtn, obfBtnFoot].forEach(b => b.disabled = false);
                    obfBtn.innerHTML = '<i data-lucide="lock" style="width:20px;height:20px;"></i>';
                    obfBtnFoot.innerHTML = '<i data-lucide="zap" style="width:13px;height:13px;"></i> Obfuscate';
                    lucide.createIcons();
                }
            }

            function doClear() {
                inputEl.value = '';
                outputEl.value = '';
                inputMeta.textContent = '';
                copyBtn.disabled = true;
                dlBtn.disabled = true;
                setStatus('Ready', '');
                setMeta(null);
                inputEl.focus();
            }

            obfBtn.addEventListener('click', doObfuscate);
            obfBtnFoot.addEventListener('click', doObfuscate);
            clearBtn.addEventListener('click', doClear);
            clearBtnFoot.addEventListener('click', doClear);

            copyBtn.addEventListener('click', async function() {
                if (!outputEl.value) return;
                try { await navigator.clipboard.writeText(outputEl.value); } catch { outputEl.select();
                    document.execCommand('copy'); }
                showToast('Copied to clipboard', 'ok');
                this.innerHTML = '<i data-lucide="check" style="width:12px;height:12px;"></i> Copied';
                this.classList.add('success');
                lucide.createIcons();
                setTimeout(() => {
                    this.innerHTML = '<i data-lucide="copy" style="width:12px;height:12px;"></i> Copy';
                    this.classList.remove('success');
                    lucide.createIcons();
                }, 1800);
            });

            dlBtn.addEventListener('click', function() {
                if (!outputEl.value) return;
                const a = Object.assign(document.createElement('a'), {
                    href: URL.createObjectURL(new Blob([outputEl.value], { type: 'text/plain' })),
                    download: 'obfuscated.lua',
                });
                a.click();
                URL.revokeObjectURL(a.href);
                showToast('Downloaded obfuscated.lua', 'ok');
            });

            inputEl.addEventListener('keydown', function(e) {
                if (e.key === 'Tab') {
                    e.preventDefault();
                    const s = this.selectionStart,
                        end = this.selectionEnd;
                    this.value = this.value.substring(0, s) + '  ' + this.value.substring(end);
                    this.selectionStart = this.selectionEnd = s + 2;
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault();
                    doObfuscate(); }
            });

            lucide.createIcons();
        })();
    </script>
</body>
</html>
