<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LuaU VM Obfuscator</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0d1117;color:#e6edf3;font-family:'Segoe UI',monospace;min-height:100vh;display:flex;flex-direction:column}
  header{padding:20px 40px;background:#161b22;border-bottom:1px solid #30363d;display:flex;align-items:center;gap:12px}
  header h1{font-size:1.4rem;font-weight:700;color:#58a6ff}
  header span{font-size:.8rem;background:#21262d;padding:2px 8px;border-radius:12px;color:#8b949e;border:1px solid #30363d}
  main{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:0;height:calc(100vh - 65px)}
  .pane{display:flex;flex-direction:column;border-right:1px solid #30363d}
  .pane:last-child{border-right:none}
  .pane-header{padding:12px 20px;background:#161b22;border-bottom:1px solid #30363d;display:flex;justify-content:space-between;align-items:center}
  .pane-header span{font-size:.85rem;color:#8b949e;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
  textarea{flex:1;width:100%;background:#0d1117;color:#e6edf3;border:none;outline:none;padding:20px;font-family:'Courier New',monospace;font-size:.85rem;line-height:1.6;resize:none;tab-size:2}
  textarea::placeholder{color:#30363d}
  .toolbar{padding:12px 20px;background:#161b22;border-top:1px solid #30363d;display:flex;gap:10px;align-items:center}
  button{padding:8px 20px;border:none;border-radius:6px;cursor:pointer;font-size:.875rem;font-weight:600;transition:all .15s}
  .btn-primary{background:#238636;color:#fff}
  .btn-primary:hover{background:#2ea043}
  .btn-primary:disabled{background:#21262d;color:#8b949e;cursor:not-allowed}
  .btn-secondary{background:#21262d;color:#e6edf3;border:1px solid #30363d}
  .btn-secondary:hover{background:#30363d}
  .status{font-size:.8rem;color:#8b949e;margin-left:auto}
  .status.error{color:#f85149}
  .status.success{color:#3fb950}
  .meta{font-size:.75rem;color:#8b949e;padding:4px 0}
  #copyBtn{display:none}
</style>
</head>
<body>
<header>
  <h1>⚡ LuaU VM Obfuscator</h1>
  <span>LuaU · VM-based · Server-side</span>
</header>
<main>
  <div class="pane">
    <div class="pane-header">
      <span>📝 Input — LuaU Source</span>
    </div>
    <textarea id="inputCode" placeholder="-- Paste your LuaU / Roblox code here...&#10;&#10;type Greeting = {name: string}&#10;&#10;local function greet(name: string): string&#10;  return 'Hello, ' .. name .. '!'&#10;end&#10;&#10;local x: number = 10 // 3&#10;x += 5&#10;print(greet('World'), x)"></textarea>
    <div class="toolbar">
      <button class="btn-primary" id="obfBtn">Obfuscate</button>
      <button class="btn-secondary" id="clearBtn">Clear</button>
      <span class="status" id="statusText"></span>
    </div>
  </div>
  <div class="pane">
    <div class="pane-header">
      <span>🔒 Output — Obfuscated</span>
    </div>
    <textarea id="outputCode" placeholder="Obfuscated output will appear here..." readonly></textarea>
    <div class="toolbar">
      <button class="btn-secondary" id="copyBtn">Copy</button>
      <span class="meta" id="metaText"></span>
    </div>
  </div>
</main>
<script>
(function(){
  const obfBtn   = document.getElementById('obfBtn');
  const clearBtn = document.getElementById('clearBtn');
  const copyBtn  = document.getElementById('copyBtn');
  const inputEl  = document.getElementById('inputCode');
  const outputEl = document.getElementById('outputCode');
  const statusEl = document.getElementById('statusText');
  const metaEl   = document.getElementById('metaText');

  function setStatus(msg, type) {
    statusEl.textContent = msg;
    statusEl.className = 'status ' + (type || '');
  }

  function setMeta(meta) {
    if (!meta) { metaEl.textContent = ''; return; }
    metaEl.textContent = `${(meta.inputSize/1024).toFixed(1)}KB → ${(meta.outputSize/1024).toFixed(1)}KB · ${meta.processingMs}ms`;
  }

  obfBtn.addEventListener('click', async function() {
    const code = inputEl.value.trim();
    if (!code) { setStatus('Please enter LuaU code first.', 'error'); return; }
    obfBtn.disabled = true;
    obfBtn.textContent = 'Obfuscating...';
    setStatus('Processing...', '');
    outputEl.value = '';
    copyBtn.style.display = 'none';
    setMeta(null);

    try {
      const res = await fetch('/api/obfuscate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code }),
      });
      const data = await res.json();
      if (!res.ok || !data.success) {
        const lineInfo = data.line ? ` (line ${data.line})` : '';
        setStatus('Error: ' + data.error + lineInfo, 'error');
      } else {
        outputEl.value = data.result;
        setStatus('Done', 'success');
        setMeta(data.meta);
        copyBtn.style.display = '';
      }
    } catch(e) {
      setStatus('Network error: ' + e.message, 'error');
    } finally {
      obfBtn.disabled = false;
      obfBtn.textContent = 'Obfuscate';
    }
  });

  clearBtn.addEventListener('click', function() {
    inputEl.value = '';
    outputEl.value = '';
    setStatus('', '');
    setMeta(null);
    copyBtn.style.display = 'none';
  });

  copyBtn.addEventListener('click', async function() {
    try {
      await navigator.clipboard.writeText(outputEl.value);
      const orig = copyBtn.textContent;
      copyBtn.textContent = 'Copied!';
      setTimeout(() => { copyBtn.textContent = orig; }, 1500);
    } catch(e) {
      outputEl.select();
      document.execCommand('copy');
    }
  });

  inputEl.addEventListener('keydown', function(e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = this.selectionStart, end = this.selectionEnd;
      this.value = this.value.substring(0, s) + '  ' + this.value.substring(end);
      this.selectionStart = this.selectionEnd = s + 2;
    }
  });
})();
</script>
</body>
</html>
